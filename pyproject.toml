[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thailand-ai-market-intelligence"
version = "3.0.0"
description = "Thailand AI Market & Decision Intelligence Platform (GEO/AEO/Search/Social/Commerce)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Adul Saa (Q)", email = "adulsa.q@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "google-genai>=0.8.0",
    "openai>=1.30.0",
    "streamlit>=1.35.0",
    "altair>=5.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
aimarket = "src.cli:app"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
