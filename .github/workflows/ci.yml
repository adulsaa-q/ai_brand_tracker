name: CI Test & Quality Suite

on:
  push:
    branches: [ main, "upgrade/**", "phase/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"

      - name: Build wheel (packaging smoke)
        run: |
          pip install build
          python -m build --wheel

      - name: Import smoke test
        run: |
          python -c "import src.api, src.runner, src.cli, src.engines, src.analytics, src.storage; print('imports ok')"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest tests/ -q
