name: Weekly Thailand AI Market Intelligence Tracker

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      engine:
        description: "Observation engine"
        default: "mock"
        type: choice
        options: [mock, gemini, openrouter]

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run intelligence pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.cli run \
            --vertical ecommerce_retail_th \
            --count 30 \
            --engine "${{ github.event.inputs.engine || 'mock' }}"

      # data/ is gitignored (local artifact dir). Publish the run as a build
      # artifact instead of committing it back to the repo.
      - name: Upload run summary
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-summary
          path: |
            data/latest_run_summary*.json
            data/run_*.json
          retention-days: 90
