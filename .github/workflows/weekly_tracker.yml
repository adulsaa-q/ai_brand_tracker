name: Weekly Thailand AI Market Intelligence Tracker

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install .

      - name: Run Intelligence Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/runner.py

      - name: Commit Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/latest_run_summary.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(data): weekly auto-track [skip ci]"
          git push
